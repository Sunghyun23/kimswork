<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title"><title id="title">A note becomes a strike or pluck, a vibrating object, a pickup or body, then effects</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#eee5d5" stroke-opacity=".04"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e6a16c"/></marker></defs><rect width="640" height="320" rx="14" fill="#221f1b"/><rect width="640" height="320" fill="url(#grid)"/><g stroke="#eee5d5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="110" width="112" height="94" rx="5" fill="#5b4432"/><text x="42" y="165" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Touch</text><rect x="185" y="110" width="112" height="94" rx="5" fill="#5b4432"/><text x="197" y="165" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Vibrate</text><rect x="340" y="110" width="112" height="94" rx="5" fill="#5b4432"/><text x="352" y="165" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Read</text><rect x="495" y="110" width="112" height="94" rx="5" fill="#5b4432"/><text x="507" y="165" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Color</text><path d="M147 157h28" marker-end="url(#arrow)"/><path d="M302 157h28" marker-end="url(#arrow)"/><path d="M457 157h28" marker-end="url(#arrow)"/><text x="35" y="91" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Velocity</text><text x="187" y="91" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Material</text><text x="344" y="91" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Pickup</text><text x="499" y="91" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">Effects</text><text x="72" y="268" font-family="sans-serif" font-size="24" fill="#eee5d5" stroke="none">The instrument comes before the effects.</text></g></svg>