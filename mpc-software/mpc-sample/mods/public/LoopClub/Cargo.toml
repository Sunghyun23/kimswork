[package]
name = "loop-club"
version = "0.9.2"
edition = "2024"
rust-version = "1.97"
authors = ["kim"]
license = "MIT"
description = "Sixteen-track audio and MIDI looper for MPC Sample"

[lib]
name = "loop_club"
crate-type = ["rlib", "cdylib"]

[dependencies]
mpc-sample-sdk = { path = "../../../../third_party/mpc-sample-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "=0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
