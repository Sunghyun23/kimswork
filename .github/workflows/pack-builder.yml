name: Build Pack Builder
on:
  workflow_dispatch:
  push:
    paths:
      - 'mpc-software/apps/public/GrooveDicePackBuilder/**'
      - 'mpc-software/shared/groove-dice-expansion/**'
      - '.github/workflows/pack-builder.yml'
  pull_request:
    paths:
      - 'mpc-software/apps/public/GrooveDicePackBuilder/**'
      - 'mpc-software/shared/groove-dice-expansion/**'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: mpc-software/apps/public/GrooveDicePackBuilder
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_authoring.py -v
      - run: python tests/test_gui.py
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pack-builder-${{ runner.os }}
          path: |
            mpc-software/apps/public/GrooveDicePackBuilder/dist/*.zip
            mpc-software/apps/public/GrooveDicePackBuilder/dist/*.sha256
            mpc-software/apps/public/GrooveDicePackBuilder/dist/build-report.json
          if-no-files-found: error
